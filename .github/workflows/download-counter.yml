name: Contatore download

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna il contatore
        run: python3 .github/scripts/update_download_counter.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Salva le modifiche
        run: |
          git add README.md .github/download-stats.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Contatore download: aggiornamento"
          git push
